name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make tools
      - name: Generated code is up to date
        run: make check-gen
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run typecheck
      - run: cd web && npm test
      - run: cd web && npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - run: cd web && npx playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            web/test-results
            bin/e2e/server.log

  # Real Authelia and Garage: sign in, then upload and download an attachment.
  compose-authelia:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - run: cp deploy/.env.dev.example deploy/.env
      - run: docker compose -f deploy/compose.yaml --profile dev up -d --build
      - name: Wait for kowhai
        run: |
          for i in $(seq 1 60); do
            docker compose -f deploy/compose.yaml exec -T kowhai wget -qO- http://127.0.0.1:8080/readyz && exit 0
            sleep 2
          done
          exit 1
      - run: docker run --rm --network kowhai_default -v $PWD/deploy/test:/t:ro alpine:3.22 sh /t/authelia-flow.sh
      - if: failure()
        run: docker compose -f deploy/compose.yaml --profile dev logs

  # Real Kanidm: discovery, ES256 keys, PKCE and the sign-in redirect.
  kanidm:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - run: deploy/test/kanidm.sh
