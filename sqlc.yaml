version: "2"
sql:
  - engine: sqlite
    # The FTS5 migration is left out because sqlc cannot parse virtual
    # tables. internal/search queries it directly.
    schema: internal/store/migrations/00001_init.sql
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        emit_json_tags: false
